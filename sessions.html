<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HPV Health Assistant — Session Dashboard</title>
    <style>
        /* ── Design System (mirrors index.html) ─────────────────────────── */
        :root {
            --color-white: rgba(255,255,255,1);
            --color-black: rgba(0,0,0,1);
            --color-cream-50: rgba(252,252,249,1);
            --color-cream-100: rgba(255,255,253,1);
            --color-gray-200: rgba(245,245,245,1);
            --color-gray-300: rgba(167,169,169,1);
            --color-gray-400: rgba(119,124,124,1);
            --color-slate-500: rgba(98,108,113,1);
            --color-brown-600: rgba(94,82,64,1);
            --color-charcoal-700: rgba(31,33,33,1);
            --color-charcoal-800: rgba(38,40,40,1);
            --color-slate-900: rgba(19,52,59,1);
            --color-teal-300: rgba(50,184,198,1);
            --color-teal-500: rgba(33,128,141,1);
            --color-usc-cardinal: rgba(153,27,30,1);
            --color-usc-cardinal-dark: rgba(123,35,46,1);
            --color-usc-gold: rgba(255,204,0,1);
            --color-usc-gold-light: rgba(254,246,211,1);
            --color-brown-600-rgb: 94,82,64;
            --color-slate-900-rgb: 19,52,59;

            --color-background: var(--color-cream-50);
            --color-surface: var(--color-cream-100);
            --color-text: var(--color-slate-900);
            --color-text-secondary: var(--color-slate-500);
            --color-primary: var(--color-usc-cardinal);
            --color-primary-hover: var(--color-usc-cardinal-dark);
            --color-btn-primary-text: var(--color-usc-gold);
            --color-border: rgba(var(--color-brown-600-rgb), 0.2);
            --color-card-border: rgba(var(--color-brown-600-rgb), 0.12);
            --color-secondary: rgba(var(--color-brown-600-rgb), 0.08);
            --color-secondary-hover: rgba(var(--color-brown-600-rgb), 0.14);

            --font-family-base: "FKGroteskNeue","Geist","Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
            --font-family-mono: "Berkeley Mono",ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;
            --font-size-xs: 11px;
            --font-size-sm: 12px;
            --font-size-base: 14px;
            --font-size-md: 16px;
            --font-size-lg: 17px;
            --font-size-xl: 18px;
            --font-size-2xl: 20px;
            --font-size-3xl: 24px;
            --font-weight-normal: 400;
            --font-weight-medium: 500;
            --font-weight-semibold: 550;
            --font-weight-bold: 600;
            --line-height-normal: 1.5;

            --space-4: 4px; --space-6: 6px; --space-8: 8px; --space-10: 10px;
            --space-12: 12px; --space-16: 16px; --space-20: 20px; --space-24: 24px;
            --space-32: 32px;
            --radius-sm: 6px; --radius-base: 8px; --radius-md: 10px;
            --radius-lg: 12px; --radius-full: 9999px;
            --shadow-xs: 0 1px 2px rgba(0,0,0,.02);
            --shadow-sm: 0 1px 3px rgba(0,0,0,.04),0 1px 2px rgba(0,0,0,.02);
            --shadow-md: 0 4px 6px -1px rgba(0,0,0,.04),0 2px 4px -1px rgba(0,0,0,.02);
            --duration-fast: 150ms;
            --ease-standard: cubic-bezier(0.16,1,0.3,1);
        }

        @font-face {
            font-family: 'FKGroteskNeue';
            src: url('https://r2cdn.perplexity.ai/fonts/FKGroteskNeue.woff2') format('woff2');
        }

        * { margin:0; padding:0; box-sizing:border-box; }

        body {
            font-family: var(--font-family-base);
            background: var(--color-background);
            color: var(--color-text);
            line-height: var(--line-height-normal);
            -webkit-font-smoothing: antialiased;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ── Header ──────────────────────────────────────────────────────── */
        .header {
            background: var(--color-surface);
            border-bottom: 1px solid var(--color-card-border);
            padding: var(--space-16) var(--space-24);
            box-shadow: var(--shadow-sm);
            flex-shrink: 0;
            z-index: 100;
        }
        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: var(--space-16);
            max-width: 1400px;
            margin: 0 auto;
        }
        .header-left { display:flex; align-items:center; gap:var(--space-16); }
        .header-icon { font-size: 28px; }
        .header-title {
            font-size: var(--font-size-2xl);
            font-weight: var(--font-weight-bold);
            color: var(--color-text);
        }
        .header-subtitle {
            font-size: var(--font-size-sm);
            color: var(--color-text-secondary);
            margin-top: 2px;
        }
        .header-badge {
            background: var(--color-primary);
            color: var(--color-usc-gold);
            font-size: var(--font-size-xs);
            font-weight: var(--font-weight-bold);
            padding: 3px 10px;
            border-radius: var(--radius-full);
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        /* ── Buttons ─────────────────────────────────────────────────────── */
        .btn {
            padding: var(--space-8) var(--space-16);
            border-radius: var(--radius-base);
            border: 1px solid var(--color-border);
            background: var(--color-surface);
            color: var(--color-text);
            font-size: var(--font-size-sm);
            font-weight: var(--font-weight-medium);
            cursor: pointer;
            transition: all var(--duration-fast) var(--ease-standard);
            font-family: var(--font-family-base);
            display: inline-flex;
            align-items: center;
            gap: var(--space-6);
            text-decoration: none;
        }
        .btn:hover { background: var(--color-secondary-hover); }
        .btn-primary {
            background: var(--color-primary);
            color: var(--color-btn-primary-text);
            border: none;
        }
        .btn-primary:hover { background: var(--color-primary-hover); }

        /* ── Stats Bar ───────────────────────────────────────────────────── */
        .stats-bar {
            background: var(--color-surface);
            border-bottom: 1px solid var(--color-card-border);
            padding: var(--space-12) var(--space-24);
            flex-shrink: 0;
        }
        .stats-inner {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            gap: var(--space-32);
            align-items: center;
        }
        .stat {
            display: flex;
            align-items: baseline;
            gap: var(--space-6);
        }
        .stat-value {
            font-size: var(--font-size-2xl);
            font-weight: var(--font-weight-bold);
            color: var(--color-primary);
        }
        .stat-label {
            font-size: var(--font-size-sm);
            color: var(--color-text-secondary);
        }
        .stats-divider {
            width: 1px;
            height: 28px;
            background: var(--color-border);
        }
        .search-wrap {
            margin-left: auto;
            position: relative;
        }
        .search-input {
            font-family: var(--font-family-base);
            font-size: var(--font-size-sm);
            padding: var(--space-8) var(--space-12) var(--space-8) 34px;
            border: 1px solid var(--color-border);
            border-radius: var(--radius-base);
            background: var(--color-background);
            color: var(--color-text);
            width: 220px;
            outline: none;
            transition: border-color var(--duration-fast);
        }
        .search-input:focus { border-color: var(--color-primary); }
        .search-icon {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 14px;
            pointer-events: none;
        }

        /* ── Main Layout ─────────────────────────────────────────────────── */
        .main {
            flex: 1;
            display: flex;
            overflow: hidden;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
        }

        /* ── Session List (left panel) ───────────────────────────────────── */
        .session-list-panel {
            width: 340px;
            flex-shrink: 0;
            border-right: 1px solid var(--color-card-border);
            overflow-y: auto;
            background: var(--color-background);
        }
        .list-header {
            padding: var(--space-16) var(--space-20);
            font-size: var(--font-size-xs);
            font-weight: var(--font-weight-bold);
            color: var(--color-text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.06em;
            border-bottom: 1px solid var(--color-card-border);
            position: sticky;
            top: 0;
            background: var(--color-background);
            z-index: 10;
        }
        .session-card {
            padding: var(--space-16) var(--space-20);
            border-bottom: 1px solid var(--color-card-border);
            cursor: pointer;
            transition: background var(--duration-fast) var(--ease-standard);
        }
        .session-card:hover { background: var(--color-secondary); }
        .session-card.active {
            background: var(--color-usc-gold-light);
            border-left: 3px solid var(--color-primary);
        }
        .card-date {
            font-size: var(--font-size-sm);
            font-weight: var(--font-weight-semibold);
            color: var(--color-text);
            margin-bottom: var(--space-4);
        }
        .card-meta {
            display: flex;
            gap: var(--space-10);
            margin-bottom: var(--space-8);
        }
        .card-chip {
            font-size: var(--font-size-xs);
            background: var(--color-secondary);
            color: var(--color-text-secondary);
            border-radius: var(--radius-full);
            padding: 2px 8px;
            border: 1px solid var(--color-card-border);
        }
        .card-chip.primary {
            background: rgba(153,27,30,0.08);
            color: var(--color-primary);
            border-color: rgba(153,27,30,0.18);
        }
        .card-summary-preview {
            font-size: var(--font-size-xs);
            color: var(--color-text-secondary);
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .empty-list {
            padding: var(--space-32) var(--space-20);
            text-align: center;
            color: var(--color-text-secondary);
        }
        .empty-list-icon { font-size: 36px; margin-bottom: var(--space-12); }

        /* ── Detail Panel (right) ────────────────────────────────────────── */
        .detail-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .detail-placeholder {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--color-text-secondary);
            gap: var(--space-12);
        }
        .detail-placeholder-icon { font-size: 48px; }
        .detail-placeholder-title {
            font-size: var(--font-size-lg);
            font-weight: var(--font-weight-semibold);
            color: var(--color-text);
        }

        /* Detail header */
        .detail-header {
            padding: var(--space-20) var(--space-24);
            border-bottom: 1px solid var(--color-card-border);
            background: var(--color-surface);
            flex-shrink: 0;
        }
        .detail-session-id {
            font-size: var(--font-size-xs);
            font-family: var(--font-family-mono);
            color: var(--color-text-secondary);
            margin-bottom: var(--space-4);
        }
        .detail-title {
            font-size: var(--font-size-xl);
            font-weight: var(--font-weight-bold);
            color: var(--color-text);
            margin-bottom: var(--space-8);
        }
        .detail-meta-row {
            display: flex;
            gap: var(--space-16);
            flex-wrap: wrap;
        }
        .detail-meta-item {
            display: flex;
            align-items: center;
            gap: var(--space-6);
            font-size: var(--font-size-sm);
            color: var(--color-text-secondary);
        }
        .detail-meta-item strong { color: var(--color-text); }

        /* Tabs */
        .tabs {
            display: flex;
            border-bottom: 1px solid var(--color-card-border);
            background: var(--color-surface);
            flex-shrink: 0;
            padding: 0 var(--space-24);
        }
        .tab-btn {
            padding: var(--space-12) var(--space-16);
            border: none;
            background: none;
            color: var(--color-text-secondary);
            font-size: var(--font-size-sm);
            font-weight: var(--font-weight-medium);
            font-family: var(--font-family-base);
            cursor: pointer;
            border-bottom: 2px solid transparent;
            margin-bottom: -1px;
            transition: all var(--duration-fast) var(--ease-standard);
            display: flex;
            align-items: center;
            gap: var(--space-6);
        }
        .tab-btn:hover { color: var(--color-text); }
        .tab-btn.active {
            color: var(--color-primary);
            border-bottom-color: var(--color-primary);
            font-weight: var(--font-weight-semibold);
        }
        .tab-count {
            background: var(--color-secondary);
            font-size: var(--font-size-xs);
            padding: 1px 6px;
            border-radius: var(--radius-full);
            font-weight: var(--font-weight-bold);
        }

        /* Tab content */
        .tab-content {
            flex: 1;
            overflow-y: auto;
            padding: var(--space-24);
        }
        .tab-pane { display: none; }
        .tab-pane.active { display: block; }

        /* ── Summary Tab ─────────────────────────────────────────────────── */
        .summary-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--space-20);
        }
        @media (max-width: 800px) { .summary-grid { grid-template-columns: 1fr; } }

        .summary-card {
            background: var(--color-surface);
            border: 1px solid var(--color-card-border);
            border-radius: var(--radius-lg);
            padding: var(--space-20);
            box-shadow: var(--shadow-xs);
        }
        .summary-card-header {
            display: flex;
            align-items: center;
            gap: var(--space-10);
            margin-bottom: var(--space-16);
        }
        .summary-card-icon {
            width: 36px;
            height: 36px;
            border-radius: var(--radius-base);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
        }
        .icon-bg-cardinal {
            background: rgba(153,27,30,0.1);
        }
        .icon-bg-gold {
            background: rgba(255,204,0,0.18);
        }
        .summary-card-title {
            font-size: var(--font-size-md);
            font-weight: var(--font-weight-semibold);
            color: var(--color-text);
        }
        .summary-card-body {
            font-size: var(--font-size-base);
            color: var(--color-text);
            line-height: 1.7;
            white-space: pre-wrap;
        }

        /* ── Conversation Tab ────────────────────────────────────────────── */
        .conversation-thread {
            display: flex;
            flex-direction: column;
            gap: var(--space-16);
            max-width: 680px;
        }
        .msg-row {
            display: flex;
            gap: var(--space-12);
            max-width: 85%;
        }
        .msg-row.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }
        .msg-avatar {
            width: 32px;
            height: 32px;
            border-radius: var(--radius-full);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            flex-shrink: 0;
            font-weight: var(--font-weight-bold);
        }
        .msg-avatar.user-avatar {
            background: var(--color-primary);
            color: var(--color-usc-gold);
        }
        .msg-avatar.asst-avatar {
            background: var(--color-usc-gold);
            color: var(--color-primary);
        }
        .msg-bubble {
            padding: var(--space-10) var(--space-16);
            border-radius: var(--radius-lg);
            font-size: var(--font-size-base);
            line-height: 1.6;
            box-shadow: var(--shadow-xs);
        }
        .msg-row.user .msg-bubble {
            background: var(--color-primary);
            color: var(--color-white);
            border-radius: var(--radius-lg) var(--radius-sm) var(--radius-lg) var(--radius-lg);
        }
        .msg-row.assistant .msg-bubble {
            background: var(--color-usc-gold);
            color: var(--color-black);
            border-radius: var(--radius-sm) var(--radius-lg) var(--radius-lg) var(--radius-lg);
        }
        .msg-role-label {
            font-size: var(--font-size-xs);
            color: var(--color-text-secondary);
            margin-bottom: var(--space-4);
            font-weight: var(--font-weight-medium);
        }
        .msg-row.user .msg-role-label { text-align: right; }
        .msg-col { display: flex; flex-direction: column; }

        /* ── Events Tab ──────────────────────────────────────────────────── */
        .event-table {
            width: 100%;
            border-collapse: collapse;
            font-size: var(--font-size-sm);
        }
        .event-table th {
            text-align: left;
            padding: var(--space-8) var(--space-12);
            font-size: var(--font-size-xs);
            font-weight: var(--font-weight-bold);
            color: var(--color-text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            border-bottom: 2px solid var(--color-card-border);
            background: var(--color-surface);
            position: sticky;
            top: 0;
            z-index: 5;
        }
        .event-table td {
            padding: var(--space-8) var(--space-12);
            border-bottom: 1px solid var(--color-card-border);
            vertical-align: top;
        }
        .event-table tr:last-child td { border-bottom: none; }
        .event-table tr:hover td { background: var(--color-secondary); }
        .event-time {
            font-family: var(--font-family-mono);
            font-size: var(--font-size-xs);
            color: var(--color-text-secondary);
            white-space: nowrap;
        }
        .event-type-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: var(--radius-full);
            font-size: var(--font-size-xs);
            font-weight: var(--font-weight-semibold);
            white-space: nowrap;
        }

        /* ── Loading / Error states ──────────────────────────────────────── */
        .loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: var(--space-32);
            gap: var(--space-12);
            color: var(--color-text-secondary);
        }
        .spinner {
            width: 28px;
            height: 28px;
            border: 3px solid var(--color-card-border);
            border-top-color: var(--color-primary);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .error-banner {
            background: rgba(153,27,30,0.06);
            border: 1px solid rgba(153,27,30,0.2);
            border-radius: var(--radius-base);
            padding: var(--space-12) var(--space-16);
            font-size: var(--font-size-sm);
            color: var(--color-primary);
            margin: var(--space-16);
        }

        /* Duration pill in card */
        .duration-pill {
            font-size: var(--font-size-xs);
            color: var(--color-text-secondary);
            margin-top: var(--space-4);
        }

        /* Responsive tweaks */
        @media (max-width: 700px) {
            .session-list-panel { width: 100%; border-right: none; }
            .main { flex-direction: column; }
            .detail-panel { display: none; }
            .detail-panel.show { display: flex; }
        }
    </style>
</head>
<body>

<!-- ── Header ──────────────────────────────────────────────────────────────── -->
<header class="header">
    <div class="header-content">
        <div class="header-left">
            <span class="header-icon">📋</span>
            <div>
                <h1 class="header-title">Session Dashboard</h1>
                <p class="header-subtitle">HPV Health Assistant — Provider View</p>
            </div>
            <span class="header-badge">Provider Only</span>
        </div>
        <div style="display:flex;gap:12px;align-items:center;">
            <button class="btn" id="refreshBtn" title="Refresh sessions">↺ Refresh</button>
            <a class="btn btn-primary" href="index.html">💬 Go to Assistant</a>
        </div>
    </div>
</header>

<!-- ── Stats Bar ────────────────────────────────────────────────────────────── -->
<div class="stats-bar">
    <div class="stats-inner">
        <div class="stat">
            <span class="stat-value" id="statTotal">—</span>
            <span class="stat-label">Total Sessions</span>
        </div>
        <div class="stats-divider"></div>
        <div class="stat">
            <span class="stat-value" id="statMessages">—</span>
            <span class="stat-label">Patient Turns</span>
        </div>
        <div class="stats-divider"></div>
        <div class="stat">
            <span class="stat-value" id="statToday">—</span>
            <span class="stat-label">Today</span>
        </div>
        <div class="search-wrap">
            <span class="search-icon">🔍</span>
            <input class="search-input" type="text" id="searchInput"
                   placeholder="Search sessions…" autocomplete="off">
        </div>
    </div>
</div>

<!-- ── Main Layout ──────────────────────────────────────────────────────────── -->
<div class="main" id="mainLayout">

    <!-- Left: Session List -->
    <aside class="session-list-panel" id="sessionListPanel">
        <div class="list-header">Sessions — newest first</div>
        <div id="sessionList">
            <div class="loading">
                <div class="spinner"></div>
                <span>Loading sessions…</span>
            </div>
        </div>
    </aside>

    <!-- Right: Detail Panel -->
    <section class="detail-panel" id="detailPanel">
        <div class="detail-placeholder" id="detailPlaceholder">
            <span class="detail-placeholder-icon">🗂️</span>
            <span class="detail-placeholder-title">Select a session to view details</span>
            <span style="font-size:13px;color:var(--color-text-secondary);">Patient conversations are saved here after each session ends.</span>
        </div>

        <!-- Populated by JS -->
        <div id="detailContent" style="display:none;flex:1;flex-direction:column;overflow:hidden;">

            <div class="detail-header">
                <div class="detail-session-id" id="detailSessionId"></div>
                <div class="detail-title" id="detailTitle"></div>
                <div class="detail-meta-row" id="detailMeta"></div>
            </div>

            <div class="tabs">
                <button class="tab-btn active" data-tab="summary">
                    📝 Summary
                </button>
                <button class="tab-btn" data-tab="conversation">
                    💬 Conversation
                    <span class="tab-count" id="tabCountMsgs">0</span>
                </button>
                <button class="tab-btn" data-tab="events">
                    📊 Events
                    <span class="tab-count" id="tabCountEvts">0</span>
                </button>
            </div>

            <div class="tab-content">
                <!-- Summary -->
                <div class="tab-pane active" id="pane-summary">
                    <div class="summary-grid" id="summaryGrid"></div>
                </div>
                <!-- Conversation -->
                <div class="tab-pane" id="pane-conversation">
                    <div class="conversation-thread" id="conversationThread"></div>
                </div>
                <!-- Events -->
                <div class="tab-pane" id="pane-events">
                    <table class="event-table">
                        <thead>
                            <tr>
                                <th style="width:90px;">Offset</th>
                                <th style="width:160px;">Type</th>
                                <th>Lang</th>
                                <th>Details</th>
                            </tr>
                        </thead>
                        <tbody id="eventsTableBody"></tbody>
                    </table>
                </div>
            </div>

        </div>
    </section>

</div>

<script>
    // ── Config ─────────────────────────────────────────────────────────────────
    // Allow ?backend=http://localhost:PORT to override for local dev
    const _backendOverride = new URLSearchParams(window.location.search).get('backend');
    const BACKEND = _backendOverride
        ? _backendOverride
        : window.location.href.includes('dipsurvey-ann.isi.edu')
            ? 'https://dipsurvey-ann.isi.edu/chathpv/bot/backend'
            : 'https://usc-hpv-chat-assistant-backend.onrender.com';

    // ── State ──────────────────────────────────────────────────────────────────
    let allSessions = [];
    let activeFilename = null;

    // ── Helpers ────────────────────────────────────────────────────────────────
    function fmtDateTime(iso) {
        if (!iso) return '—';
        const d = new Date(iso);
        return d.toLocaleString(undefined, {
            month: 'short', day: 'numeric', year: 'numeric',
            hour: '2-digit', minute: '2-digit'
        });
    }
    function fmtDateShort(iso) {
        if (!iso) return '—';
        return new Date(iso).toLocaleDateString(undefined, {
            month: 'short', day: 'numeric', year: 'numeric'
        });
    }
    function fmtDuration(createdIso, endedIso) {
        if (!createdIso || !endedIso) return null;
        const ms = new Date(endedIso) - new Date(createdIso);
        if (ms < 0) return null;
        const secs = Math.floor(ms / 1000);
        const mins = Math.floor(secs / 60);
        const rem  = secs % 60;
        return mins > 0 ? `${mins}m ${rem}s` : `${secs}s`;
    }
    function fmtOffset(baseIso, eventIso) {
        if (!baseIso || !eventIso) return '—';
        const ms = new Date(eventIso) - new Date(baseIso);
        if (ms < 0) return '—';
        const secs  = Math.floor(ms / 1000);
        const mins  = Math.floor(secs / 60);
        const rem   = secs % 60;
        return `+${mins > 0 ? mins + 'm ' : ''}${rem}s`;
    }
    function isToday(iso) {
        if (!iso) return false;
        const d = new Date(iso);
        const now = new Date();
        return d.getDate() === now.getDate()
            && d.getMonth() === now.getMonth()
            && d.getFullYear() === now.getFullYear();
    }
    function escHtml(str) {
        return String(str ?? '')
            .replace(/&/g,'&amp;').replace(/</g,'&lt;')
            .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    // Badge colour cycling for event types
    const EVENT_COLORS = [
        '#99111e20,#99111e', '#ffcc0020,#8a6c00', '#13343b20,#13343b',
        '#2d6a4f20,#2d6a4f', '#6a2d7020,#6a2d70', '#0d6e6e20,#0d6e6e',
    ];
    const eventColorMap = {};
    let colorIdx = 0;
    function eventColor(type) {
        if (!eventColorMap[type]) {
            eventColorMap[type] = EVENT_COLORS[colorIdx++ % EVENT_COLORS.length];
        }
        const [bg, fg] = eventColorMap[type].split(',');
        return `background:${bg};color:${fg};border:1px solid ${fg}40;`;
    }

    // ── Fetch all sessions ─────────────────────────────────────────────────────
    async function loadSessions() {
        document.getElementById('sessionList').innerHTML = `
            <div class="loading"><div class="spinner"></div><span>Loading…</span></div>`;
        try {
            const resp = await fetch(BACKEND + '/api/sessions');
            if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
            const data = await resp.json();
            allSessions = data.sessions || [];
            updateStats();
            renderList(allSessions);
        } catch (e) {
            document.getElementById('sessionList').innerHTML =
                `<div class="error-banner">⚠️ Could not load sessions: ${escHtml(e.message)}</div>`;
        }
    }

    function updateStats() {
        document.getElementById('statTotal').textContent = allSessions.length;
        const totalTurns = allSessions.reduce((a,s) => a + (s.user_turns || 0), 0);
        document.getElementById('statMessages').textContent = totalTurns;
        const todayCount = allSessions.filter(s => isToday(s.created_at)).length;
        document.getElementById('statToday').textContent = todayCount;
    }

    function renderList(sessions) {
        const container = document.getElementById('sessionList');
        if (!sessions.length) {
            container.innerHTML = `
                <div class="empty-list">
                    <div class="empty-list-icon">🗂️</div>
                    <div style="font-weight:600;margin-bottom:6px;">No sessions found</div>
                    <div style="font-size:13px;">Conversations will appear here after patients use the assistant.</div>
                </div>`;
            return;
        }
        container.innerHTML = sessions.map(s => {
            const dur = fmtDuration(s.created_at, s.ended_at);
            const previewText = s.summary?.patient_questions
                ? s.summary.patient_questions.replace(/^•\s*/gm, '').trim()
                : 'No summary available.';
            return `
                <div class="session-card${s.filename === activeFilename ? ' active' : ''}"
                     data-filename="${escHtml(s.filename)}"
                     onclick="selectSession('${escHtml(s.filename)}')">
                    <div class="card-date">${fmtDateTime(s.created_at)}</div>
                    <div class="card-meta">
                        <span class="card-chip primary">💬 ${s.user_turns ?? 0} questions</span>
                        <span class="card-chip">📊 ${s.event_count ?? 0} events</span>
                        ${dur ? `<span class="card-chip">⏱ ${dur}</span>` : ''}
                    </div>
                    <div class="card-summary-preview">${escHtml(previewText)}</div>
                </div>`;
        }).join('');
    }

    // ── Load single session detail ─────────────────────────────────────────────
    async function selectSession(filename) {
        if (activeFilename === filename) return;
        activeFilename = filename;

        // Highlight active card
        document.querySelectorAll('.session-card').forEach(c => {
            c.classList.toggle('active', c.dataset.filename === filename);
        });

        // Show spinner inside detail panel
        const placeholder = document.getElementById('detailPlaceholder');
        const content     = document.getElementById('detailContent');
        placeholder.style.display = 'flex';
        placeholder.innerHTML = `<div class="loading"><div class="spinner"></div><span>Loading session…</span></div>`;
        content.style.display = 'none';

        try {
            const resp = await fetch(BACKEND + '/api/sessions/' + encodeURIComponent(filename));
            if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
            const session = await resp.json();
            renderDetail(session);
        } catch (e) {
            placeholder.innerHTML =
                `<div class="error-banner">⚠️ Could not load session: ${escHtml(e.message)}</div>`;
        }
    }

    function renderDetail(s) {
        const placeholder = document.getElementById('detailPlaceholder');
        const content     = document.getElementById('detailContent');

        // Header
        document.getElementById('detailSessionId').textContent = `Session ID: ${s.session_id || '—'}`;
        document.getElementById('detailTitle').textContent = fmtDateTime(s.created_at);

        const dur = fmtDuration(s.created_at, s.ended_at);
        const msgs = (s.messages || []);
        const userTurns = msgs.filter(m => m.role === 'user').length;
        document.getElementById('detailMeta').innerHTML = [
            `<div class="detail-meta-item">⏱ Duration: <strong>${dur ?? '—'}</strong></div>`,
            `<div class="detail-meta-item">💬 Patient questions: <strong>${userTurns}</strong></div>`,
            `<div class="detail-meta-item">📊 Events: <strong>${(s.events||[]).length}</strong></div>`,
            s.ended_at ? `<div class="detail-meta-item">🏁 Ended: <strong>${fmtDateTime(s.ended_at)}</strong></div>` : ''
        ].join('');

        // Tab counts
        document.getElementById('tabCountMsgs').textContent = msgs.length;
        document.getElementById('tabCountEvts').textContent = (s.events||[]).length;

        // ── Summary pane ──
        const pqs = s.summary?.patient_questions || 'No patient questions recorded.';
        const ais = s.summary?.action_items       || 'No action items generated.';
        document.getElementById('summaryGrid').innerHTML = `
            <div class="summary-card">
                <div class="summary-card-header">
                    <div class="summary-card-icon icon-bg-cardinal">🙋</div>
                    <div>
                        <div class="summary-card-title">Patient Questions</div>
                        <div style="font-size:12px;color:var(--color-text-secondary);">Topics raised by the patient</div>
                    </div>
                </div>
                <div class="summary-card-body">${escHtml(pqs)}</div>
            </div>
            <div class="summary-card">
                <div class="summary-card-header">
                    <div class="summary-card-icon icon-bg-gold">🩺</div>
                    <div>
                        <div class="summary-card-title">Provider Action Items</div>
                        <div style="font-size:12px;color:var(--color-text-secondary);">Suggested follow-ups for the provider</div>
                    </div>
                </div>
                <div class="summary-card-body">${escHtml(ais)}</div>
            </div>`;

        // ── Conversation pane ──
        const thread = document.getElementById('conversationThread');
        if (!msgs.length) {
            thread.innerHTML = `<div style="color:var(--color-text-secondary);font-size:13px;">No messages recorded for this session.</div>`;
        } else {
            thread.innerHTML = msgs.map(m => {
                const isUser = m.role === 'user';
                const avatar = isUser
                    ? `<div class="msg-avatar user-avatar">P</div>`
                    : `<div class="msg-avatar asst-avatar">A</div>`;
                const label  = isUser ? 'Patient' : 'Assistant';
                return `
                    <div class="msg-row ${isUser ? 'user' : 'assistant'}">
                        ${avatar}
                        <div class="msg-col">
                            <div class="msg-role-label">${label}</div>
                            <div class="msg-bubble">${escHtml(m.content || '')}</div>
                        </div>
                    </div>`;
            }).join('');
        }

        // ── Events pane ──
        const evts = s.events || [];
        const tbody = document.getElementById('eventsTableBody');
        if (!evts.length) {
            tbody.innerHTML = `<tr><td colspan="4" style="color:var(--color-text-secondary);padding:16px;">No events recorded.</td></tr>`;
        } else {
            const base = evts[0]?.timestamp;
            tbody.innerHTML = evts.map(e => `
                <tr>
                    <td class="event-time">${fmtOffset(base, e.timestamp)}</td>
                    <td><span class="event-type-badge" style="${eventColor(e.type)}">${escHtml(e.type)}</span></td>
                    <td style="font-size:12px;color:var(--color-text-secondary);">${escHtml(e.language || '—')}</td>
                    <td style="font-size:12px;color:var(--color-text-secondary);">${escHtml(e.details || '')}</td>
                </tr>`).join('');
        }

        // Show content
        placeholder.style.display = 'none';
        content.style.display = 'flex';

        // Reset to Summary tab
        switchTab('summary');
    }

    // ── Tab switching ──────────────────────────────────────────────────────────
    function switchTab(tabId) {
        document.querySelectorAll('.tab-btn').forEach(b => {
            b.classList.toggle('active', b.dataset.tab === tabId);
        });
        document.querySelectorAll('.tab-pane').forEach(p => {
            p.classList.toggle('active', p.id === 'pane-' + tabId);
        });
    }
    document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => switchTab(btn.dataset.tab));
    });

    // ── Search ─────────────────────────────────────────────────────────────────
    document.getElementById('searchInput').addEventListener('input', function () {
        const q = this.value.trim().toLowerCase();
        if (!q) { renderList(allSessions); return; }
        const filtered = allSessions.filter(s => {
            const dateStr = fmtDateTime(s.created_at).toLowerCase();
            const pqs = (s.summary?.patient_questions || '').toLowerCase();
            const ais = (s.summary?.action_items || '').toLowerCase();
            return dateStr.includes(q) || pqs.includes(q) || ais.includes(q);
        });
        renderList(filtered);
    });

    // ── Refresh ────────────────────────────────────────────────────────────────
    document.getElementById('refreshBtn').addEventListener('click', () => {
        activeFilename = null;
        document.getElementById('detailPlaceholder').style.display = 'flex';
        document.getElementById('detailPlaceholder').innerHTML = `
            <span class="detail-placeholder-icon">🗂️</span>
            <span class="detail-placeholder-title">Select a session to view details</span>
            <span style="font-size:13px;color:var(--color-text-secondary);">Patient conversations are saved here after each session ends.</span>`;
        document.getElementById('detailContent').style.display = 'none';
        loadSessions();
    });

    // ── Boot ───────────────────────────────────────────────────────────────────
    loadSessions();
</script>
</body>
</html>
